<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QueueFlow Email Service</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #0F172A;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: #1E293B;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
      max-width: 440px;
      border: 1px solid #334155;
    }
    .badge {
      display: inline-block;
      background: #065F46;
      color: #34D399;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #FFFFFF;
    }
    p {
      margin: 0;
      color: #94A3B8;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● Service Online</div>
    <h1>QueueFlow Email Service</h1>
    <p>Patient verification & Clinic admin invitation microservice is active and running.</p>

</html>
